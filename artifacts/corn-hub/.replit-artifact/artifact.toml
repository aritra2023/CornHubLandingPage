kind = "web"
previewPath = "/"
title = "Corn Hub"
version = "1.0.0"
id = "artifacts/corn-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25689

[services.development]
run = "pnpm --filter @workspace/corn-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/corn-hub", "run", "build" ]
publicDir = "artifacts/corn-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25689"
BASE_PATH = "/"
